name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A debug build resolves the frontend through `devUrl` rather than embedding
# `ui/dist`, so none of the Rust jobs need bun or a built frontend. Only the
# release build does.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Lint on both platform branches: the console-window suppression and the
        # Windows arm of the cookie-browser support table sit behind cfg(windows)
        # and are invisible to a Linux-only clippy run.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install the WebKit and GTK development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install the WebKit and GTK development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --manifest-path src-tauri/Cargo.toml --no-fail-fast

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --cwd ui
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
      - run: bun run --cwd ui astro check
      - run: bun test ui

  # Single required status check for the branch ruleset, so matrix legs can be
  # added or renamed without editing the ruleset. `always()` is what makes a
  # failed dependency reach the guard step instead of skipping this job, since a
  # skipped required check blocks a pull request rather than failing it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, frontend]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
