#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
worktree_root = "~/Git/lev/media-dlp-worktrees"
branch_prefix = "lev/"
baseline_ref = "origin/main"
baseline_dir = "~/Git/lev/media-dlp-worktrees/_baselines"

# The origin remote is HTTPS and already names the repository, but spelling
# both keys out keeps issue and PR routing independent of remote rewrites.
[github]
issues_repo = "AbysmalBiscuit/media-dlp"
pr_repo = "AbysmalBiscuit/media-dlp"

# A globally exported LINEAR_API_KEY would otherwise make detection resolve
# Linear for this project, which has nothing in Linear.
[tracker]
kind = "github"

# The Astro dev server. The registry hands each worktree its own port, and
# the dev task passes that port to the Tauri CLI, so two checkouts can run
# side by side.
[apps.ui]
path = "ui"
base_port = 1420
# Node is run directly so the pid devkit tracks is the one holding the socket,
# and the IPv4 host is what devkit's listener probe connects to.
launch = ["node", "node_modules/astro/bin/astro.mjs", "dev", "--host", "127.0.0.1", "--port", "{{ port }}", "--ignore-lock"]
# Astro daemonises its dev server when it detects an agent session, which
# would leave devkit supervising a process that has already exited. This is
# the variable the daemon sets for its child, and it disables the detection.
static_env = { ASTRO_DEV_BACKGROUND = "1" }

[tasks.fmt]
description = "Format the Rust sources"
run = ["cargo", "fmt", "--manifest-path", "src-tauri/Cargo.toml", "--all"]

[tasks.lint]
description = "Clippy across all targets, warnings are errors"
run = ["cargo", "clippy", "--manifest-path", "src-tauri/Cargo.toml", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
description = "Run the Rust test suite"
run = ["cargo", "nextest", "run", "--manifest-path", "src-tauri/Cargo.toml"]

[tasks.fmt-check]
description = "Fail if the Rust sources are unformatted"
run = ["cargo", "fmt", "--manifest-path", "src-tauri/Cargo.toml", "--all", "--check"]

[tasks.check]
description = "Format check, lint and test in one pass"
steps = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
]

[tasks.ui-build]
description = "Build the Astro frontend"
run = ["bun", "run", "--cwd", "ui", "build"]

[tasks.dev]
description = "Run the Tauri app against a registry-allocated Astro dev server"
steps = [
  { up = "ui" },
  { task = "tauri-dev" },
]

# The inline config points Tauri at the devkit-managed server and drops the
# beforeDevCommand that would otherwise start a second one on the fixed port.
[tasks.tauri-dev]
description = "Open the Tauri window against the live ui server"
run = [
  "bun", "ui/node_modules/@tauri-apps/cli/tauri.js", "dev",
  "--config", "src-tauri/tauri.conf.json",
  "--config", '''{"build":{"devUrl":"http://localhost:{{ ports['ui'] }}","beforeDevCommand":null}}''',
]

[tasks.build]
description = "Build the installer"
run = ["bun", "ui/node_modules/@tauri-apps/cli/tauri.js", "build", "--config", "src-tauri/tauri.conf.json"]

[tasks.exe]
description = "Build the release exe without an installer"
run = ["bun", "ui/node_modules/@tauri-apps/cli/tauri.js", "build", "--no-bundle", "--config", "src-tauri/tauri.conf.json"]

[tasks.exe-debug]
description = "Build the debug exe without an installer"
run = ["bun", "ui/node_modules/@tauri-apps/cli/tauri.js", "build", "--debug", "--no-bundle", "--config", "src-tauri/tauri.conf.json"]

[tasks.ui-test]
description = "Run the frontend unit tests"
run = ["bun", "test", "ui"]

[tasks.ui-check]
description = "Type-check the Astro frontend"
run = ["ui/node_modules/.bin/astro.exe", "check", "--root", "ui"]
